# SIW Intent Brain - Configuration Example
# Copy this file to config.yaml and customize as needed

# Do not commit a real key. Environment variables take precedence over this file.
ai:
  api_key: replace-at-runtime
  base_url: https://your-openai-compatible-gateway.example/v1
  model: your-model-id
  provider: cc_switch
  timeout_s: 30
  max_retries: 3
  backoff_s: 1.2
  # http_referer: https://siw.example.com
  # app_name: SIW Intent Brain

brain:
  min_confidence: 0.35
  max_rationale_chars: 280
  max_list_items: 10
  response_format_json: true
